name: OpenIntuneBaseline Parity Check

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openintunebaseline-parity
  cancel-in-progress: false

jobs:
  compare:
    name: Compare bundled OpenIntuneBaseline templates
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Compare OpenIntuneBaseline templates
        id: comparison
        shell: pwsh
        run: |
          $null = New-Item -Path ./build -ItemType Directory -Force
          ./scripts/Update-OpenIntuneBaselineTemplates.ps1 2>&1 |
            Tee-Object -FilePath ./build/openintunebaseline-update.log

          $templatePathSpec = 'Templates/OpenIntuneBaseline'
          $null = New-Item -Path ./build/openintunebaseline-diff.txt -ItemType File -Force
          git diff --name-status -- $templatePathSpec |
            Add-Content -Path ./build/openintunebaseline-diff.txt -Encoding utf8
          $null = New-Item -Path ./build/openintunebaseline-diff.patch -ItemType File -Force
          git diff -- $templatePathSpec |
            Add-Content -Path ./build/openintunebaseline-diff.patch -Encoding utf8

          $diffSummary = Get-Content -Path ./build/openintunebaseline-diff.txt -Raw
          $hasDifferences = -not [string]::IsNullOrWhiteSpace($diffSummary)
          "has_differences=$($hasDifferences.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub issue
        if: steps.comparison.outputs.has_differences == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          $title = 'Update bundled OpenIntuneBaseline templates'
          $issueBodyPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'openintunebaseline-issue.md'
          $diffSummary = Get-Content -Path ./build/openintunebaseline-diff.txt -Raw

          @"
          The weekly OpenIntuneBaseline parity check found drift after syncing bundled templates from upstream.

          ``````diff
          $diffSummary
          ``````

          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Review the workflow artifact for the full patch, then update ``Templates/OpenIntuneBaseline/`` as needed.
          "@ | Set-Content -Path $issueBodyPath -Encoding utf8

          $existingIssue = gh issue list `
              --state open `
              --search "`"$title`" in:title" `
              --json number `
              --jq '.[0].number // ""'

          if ($existingIssue) {
              gh issue comment $existingIssue --body-file $issueBodyPath
              Write-Host "Updated existing issue #$existingIssue."
          } else {
              gh issue create --title $title --body-file $issueBodyPath
          }

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openintunebaseline-comparison
          path: |
            build/openintunebaseline-update.log
            build/openintunebaseline-diff.txt
            build/openintunebaseline-diff.patch
          if-no-files-found: warn

      - name: Fail on drift
        if: steps.comparison.outputs.has_differences == 'true'
        shell: pwsh
        run: |
          Write-Error 'Bundled OpenIntuneBaseline templates drifted from upstream.'
