name: IntuneLinuxBaseline Parity Check

on:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: intunelinuxbaseline-parity
  cancel-in-progress: false

jobs:
  compare:
    name: Compare bundled IntuneLinuxBaseline templates
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Run IntuneLinuxBaseline comparison
        shell: pwsh
        run: |
          $null = New-Item -Path ./build -ItemType Directory -Force
          ./scripts/Compare-LinuxBaseline.ps1 `
            -OutputPath ./build/intunelinuxbaseline-comparison.json `
            2>&1 | Tee-Object -FilePath ./build/intunelinuxbaseline-comparison.log

      - name: Evaluate comparison result
        id: comparison
        shell: pwsh
        run: |
          $result = Get-Content -Path ./build/intunelinuxbaseline-comparison.json -Raw | ConvertFrom-Json
          "has_differences=$($result.HasDifferences.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "difference_count=$($result.DifferenceCount)" >> $env:GITHUB_OUTPUT
          "modified_count=$($result.ModifiedCount)" >> $env:GITHUB_OUTPUT
          "only_upstream_count=$($result.OnlyUpstreamCount)" >> $env:GITHUB_OUTPUT
          "only_local_count=$($result.OnlyLocalCount)" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub issue
        if: steps.comparison.outputs.has_differences == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          $title = 'Update bundled IntuneLinuxBaseline templates'
          $result = Get-Content -Path ./build/intunelinuxbaseline-comparison.json -Raw | ConvertFrom-Json
          $issueBodyPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'intunelinuxbaseline-issue.md'

          function Add-FileList {
              param(
                  [Parameter(Mandatory)]
                  [string]$Title,

                  [Parameter()]
                  [object[]]$Files
              )

              Add-Content -Path $issueBodyPath -Value "## $Title"
              if ($Files.Count -eq 0) {
                  Add-Content -Path $issueBodyPath -Value '_None_'
                  Add-Content -Path $issueBodyPath -Value ''
                  return
              }

              foreach ($file in $Files) {
                  Add-Content -Path $issueBodyPath -Value "- ``$file``"
              }
              Add-Content -Path $issueBodyPath -Value ''
          }

          $bodyLines = @(
              "The weekly IntuneLinuxBaseline parity check found $($result.DifferenceCount) difference(s) between the bundled templates and source ``$($result.UpstreamRepository)`` ``$($result.Branch)``.",
              '',
              '| Category | Count |',
              '| --- | ---: |',
              "| Modified files | $($result.ModifiedCount) |",
              "| Only in source | $($result.OnlyUpstreamCount) |",
              "| Only in local | $($result.OnlyLocalCount) |",
              "| Local bundled files | $($result.TotalLocal) |",
              "| Source files | $($result.TotalUpstream) |",
              '',
              "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
              ''
          )
          Set-Content -Path $issueBodyPath -Value $bodyLines

          Add-FileList -Title 'Modified files' -Files $result.Modified
          Add-FileList -Title 'Only in source' -Files $result.OnlyUpstream
          Add-FileList -Title 'Only in local' -Files $result.OnlyLocal

          Add-Content -Path $issueBodyPath -Value 'Please review the source release and update `Templates/Compliance/` and `Templates/LinuxScripts/` as needed.'

          $existingIssue = gh issue list `
              --state open `
              --search "`"$title`" in:title" `
              --json number `
              --jq '.[0].number // ""'

          if ($existingIssue) {
              gh issue comment $existingIssue --body-file $issueBodyPath
              Write-Host "Updated existing issue #$existingIssue."
          } else {
              gh issue create --title $title --body-file $issueBodyPath
          }

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: intunelinuxbaseline-comparison
          path: |
            build/intunelinuxbaseline-comparison.json
            build/intunelinuxbaseline-comparison.log
          if-no-files-found: warn
